name: Validate curriculum

on:
  pull_request:
  push:
    branches: [main]

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_curriculum.py
      - run: python3 scripts/validate_links.py
      - run: python3 scripts/validate_markdown.py
